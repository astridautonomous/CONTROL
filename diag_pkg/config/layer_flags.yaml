# ============================================================
#  Bu dosyayı değiştirip tekrar launch et (build gerekmez):
#    ros2 launch diag_pkg diag_all.launch.py
#
#  Ya da terminalden override et:
#    ros2 launch diag_pkg diag_all.launch.py slam:=false
# ============================================================
 
layer_flags:
  enable_perception:                   true
  enable_slam:                         true
  enable_navigation:                   true
  enable_control:                      true
  enable_emergency_brake:              true
  enable_loop_detector:                true
  enable_odometry:                     true
  enable_camera_object_detection:      true
